# What a developer might ask, and where the answer lives in CPython 3.12.8. A hit on any listed symbol counts.
# Paraphrase queries deliberately avoid the identifier's own words. Dev and test are assigned by a hash of
# the query text (see evals/run.py), so nobody picks which queries land in the test set.
